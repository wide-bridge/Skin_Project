app:
  name: skin-diagnosis-proj
  env: local

datasets:
  derma_ai_root: D:/vibe_coding/codex/DocTalk/Derma_AI/face_derma_data/face_derma_data
  qna_training_root: D:/vibe_coding/codex/DocTalk/Large_AI_healthcare_QNA/data/Training
  processed_dir: data/processed
  test_per_class_view: 20

vlm:
  model_id: Qwen/Qwen3-VL-4B-Instruct
  adapter_path: null
  resume_adapter_strategy: latest
  resume_optimizer_state: true
  reset_patience_on_resume: true
  device: cuda
  torch_dtype: float16
  use_qlora: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  max_new_tokens: 256
  do_sample: false
  train_max_samples: 2048
  val_max_samples: 240
  train_max_steps: 0
  epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  log_every_steps: 25
  early_stopping_patience: 3

baseline:
  backbone: efficientnet_b0
  image_size: 384
  batch_size: 32
  epochs: 50
  learning_rate: 0.0003
  num_workers: 0
  train_max_samples: 0
  val_max_samples: 0
  early_stopping_patience: 8
  human_review_confidence_threshold: 0.8

rag:
  retrieval_top_k: 3
  derma_corpus_path: data/processed/rag_corpus_derma.jsonl
  plastic_corpus_path: data/processed/rag_corpus_plastic.jsonl
  alias_mapping_path: config/rag_aliases.json
  default_guidance_terms:
    - 피부건조증
    - 피부염
    - 여드름
    - 아토피성 피부염
    - 건선

prompts:
  diagnosis_system: prompts/diagnosis_system.txt



